<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 12px;
      background: #f8f9fa;
      color: #202124;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
    }
    #search {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #dadce0;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .chat-list {
      max-height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chat-item {
      background: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-title {
      font-size: 13px;
      color: #1a73e8;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }
    .chat-title:hover {
      text-decoration: underline;
    }
    .unarchive-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }
    .empty-state {
      font-size: 13px;
      color: #5f6368;
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <h3>📦 Archived Gemini Chats</h3>
  <input type="text" id="search" placeholder="Search archives..." />
  <div id="list" class="chat-list"></div>

  <script src="popup.js"></script>
</body>
</html>
